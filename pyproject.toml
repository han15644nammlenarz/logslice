[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "logslice"
version = "0.1.0"
description = "A fast CLI utility for extracting time-bounded slices from large log files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["logs", "cli", "binary-search", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Logging",
]

[project.scripts]
logslice = "logslice.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logslice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
